name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PhotoVideoRecovery-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/PhotoVideoRecovery-v1.0.apk
          ls -la output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVideoRecovery-APK
          path: output/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
